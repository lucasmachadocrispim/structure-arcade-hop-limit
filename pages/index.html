<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOP LIMIT</title>
<style>
  html,body{margin:0;height:100%;background:#12121A;color:#F2E8D5;
    font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center}
  main{text-align:center;max-width:480px;padding:2em}
  h1{font-size:2.4em;color:#E8B44B;margin:0 0 .2em;letter-spacing:.04em}
  p{color:#9a9aa6;margin:.4em 0}
  .msg{min-height:2em;color:#5FB8C8;font-family:"Courier New",monospace;font-size:.9em}
</style>
</head>
<body>
<main>
  <h1>HOP LIMIT</h1>
  <p>Preparando a versão certa para você…</p>
  <div class="msg" id="msg"></div>
  <noscript>Habilite JavaScript para jogar.</noscript>
</main>
<script>
(async () => {
  const msg = document.getElementById('msg');

  // Lê o rollout.json — se falhar, cai pra homologação
  let cfg = { estavel: null, canario: null, percentual: 0 };
  try {
    const r = await fetch('rollout.json', { cache: 'no-store' });
    const txt = await r.text();
    if (txt && txt.trim()) cfg = JSON.parse(txt);
  } catch (e) { /* rollout.json ausente/inválido */ }

  // Se não tem versão estável, manda para homologação
  if (!cfg.estavel) {
    msg.textContent = 'Redirecionando para homologação…';
    location.replace('hml/');
    return;
  }

  // Escolhe versão: respeita sessão, senão sorteia canário
  let v = null;
  try { v = localStorage.getItem('versao'); } catch (e) {}
  const validas = [cfg.estavel, cfg.canario].filter(Boolean);
  if (!validas.includes(v)) {
    v = (cfg.canario && Math.random() * 100 < (cfg.percentual || 0)) ? cfg.canario : cfg.estavel;
    try { localStorage.setItem('versao', v); } catch (e) {}
  }

  msg.textContent = 'Carregando versão ' + v + '…';
  location.replace('releases/' + v + '/');
})();
</script>
</body>
</html>
